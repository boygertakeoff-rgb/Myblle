<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myblle PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:white}
.header{background:#1e293b;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #3b82f6;position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:bold;color:#3b82f6}.logo span{color:white}
.card{background:#1e293b;margin:12px;padding:16px;border-radius:12px;border:1px solid #334155}
.btn{background:#3b82f6;color:white;padding:12px;border:none;border-radius:8px;width:100%;font-weight:bold;margin-top:8px;cursor:pointer}
.btn-green{background:#10b981}.btn-red{background:#ef4444}.btn-small{width:auto;padding:6px 10px;font-size:12px;display:inline-block}
.input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.price{color:#10b981;font-weight:bold}
.badge{background:#3b82f6;padding:4px 8px;border-radius:20px;font-size:11px}
#loginScreen{position:fixed;inset:0;background:#0f172a;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.tabs{display:flex;gap:6px;margin:12px}.tab{flex:1;padding:10px;background:#1e293b;border:1px solid #334155;border-radius:8px;text-align:center;cursor:pointer;font-size:13px}.tab.active{background:#3b82f6}
.hidden{display:none!important}
@media print{body *{visibility:hidden} #reciboPrint, #reciboPrint *{visibility:visible} #reciboPrint{position:absolute;left:0;top:0;width:100%;background:white;color:black;padding:20px}}
</style>
</head>
<body>

<div id="loginScreen">
<div class="card" style="width:100%;max-width:360px">

<p style="text-align:center;color:#94a3b8;margin:8px 0;font-size:13px" id="loginSub">Login do Sistema</p>
<input class="input" id="user" placeholder="Usuário" value="admin">
<input class="input" id="pass" type="password" placeholder="Senha" value="myblle123">

<b>💰 Caixa:</b> caixa / caixa123<br>

</div>
<p id="loginErro" style="color:#ef4444;text-align:center;margin-top:8px;font-size:13px"></p>
</div>
</div>

<div class="header">
